name: APK
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Derle
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle -p android assembleRelease --no-daemon -q
      - name: Yayınla (her zaman en güncel → releases/latest/download/bambaska.apk)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk bambaska.apk
          gh release create "apk-${{ github.run_number }}" bambaska.apk --title "Bambaşka APK 1.${{ github.run_number }}" --notes "Kafe uygulaması Android kurulum dosyası. İçerik her açılışta siteden güncel gelir." --latest
